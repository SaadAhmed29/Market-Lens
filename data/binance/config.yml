# MarketLens - Binance Exchange Configuration

# Exchange
exchange: binance

# Symbols / assets to collect data for
symbols:
  - DOGE
  - SOL
  - BTC
  - ETH
  - ADA
  - LTC
  - MINA
  - SUI


# Time horizon (resolution) for the data
time_horizon: "1d"

# Date range for the data
start_date: "2023-01-01"
end_date: "today"  # Resolved dynamically at runtime to current date

# Data processing
fill_missing_data: "interpolation"

# Retry configuration for network errors
retries: 3
retry_delay: 5  # seconds between retries
