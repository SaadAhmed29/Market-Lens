# MarketLens - Bybit Exchange Configuration

# Exchange
exchange: bybit

# Symbols / assets to collect data for
symbols:
  - DOGE
  - SOL
  - BTC
  - ETH
  - ADA
  - LTC
  - MINA
  - SUI


# Time horizon (resolution) for the data
time_horizon: "1m"

# Date range for the data
start_date: "2026-06-26"
end_date: "now"  # Resolved dynamically at runtime to current date

# Data processing
fill_missing_data: "interpolation"

# Retry configuration for network errors
retries: 3
retry_delay: 5  # seconds between retries
