model_type: classification # regression | classification | timeseries

train_start_date: "2025-01-01"
train_end_date: "2025-12-31"
val_start_date: "2026-01-01"
val_end_date: "2026-05-31"

data:
  enabled: true
  symbol: BTC
  exchange: binance
  timeframe: 15m
  start_date: "2025-01-01"
  end_date: "2026-06-01"

features:
  enabled: true

  indicators:
    EMA:
      - parameters:
          timeperiod: 20
        aliases:
          ema: ind_EMA_20

      - parameters:
          timeperiod: 50
        aliases:
          ema: ind_EMA_50

    RSI:
      - parameters:
          timeperiod: 14
        aliases:
          rsi: ind_RSI_14

    MACD:
      - parameters:
          fastperiod: 12
          slowperiod: 26
          signalperiod: 9
        aliases:
          macd: ind_MACD_12_26_9
          macd_signal: ind_MACD_SIGNAL_12_26_9
          macd_hist: ind_MACD_HIST_12_26_9

    PATTERNS:
      DOJI:
        aliases:
          pattern: pat_DOJI

      ENGULFING:
        aliases:
          pattern: pat_BULLISH_ENGULFING

  sentiment:
    enabled: false
    source:
      - reddit
    aliases:
      sentiment: sen_MARKET

target:
  classification:
    - source: close
      method: future_direction
      horizon: 1
      threshold: 0.30
      classes:
        positive: 1
        negative: -1
        neutral: 0

  regression:
    - source: close
      method: future_return
      horizon: 1
  
  timeseries:
    - source: close
      method: next_close
      horizon: 1

primary_metric: avg_return

models:
  classification:
    - name: logistic_regression
    - name: decision_tree
    - name: random_forest
    - name: extra_trees
    - name: xgboost
    - name: lightgbm
    - name: catboost
    - name: svm

    - name: bilstm
      params:
        sequence_length: 60
        hidden_units: [64, 32]
        dropout: 0.3
        recurrent_dropout: 0.2
        dense_units: 16
        activation: relu
        output_activation: softmax
        optimizer: adam
        learning_rate: 0.001
        loss: categorical_crossentropy
        metrics: ["accuracy"]
        batch_size: 32
        epochs: 10
        early_stopping_patience: 3

  regression:
    - name: lightgbm
    - name: svr
    - name: linear_regression
    - name: catboost
    - name: xgboost
    - name: ridge
    - name: lasso
    - name: random_forest
    - name: extra_trees

    - name: gru
      params:
        sequence_length: 60
        hidden_units: [64, 32]
        dropout: 0.2
        recurrent_dropout: 0.2
        dense_units: 16
        activation: relu
        output_activation: linear
        optimizer: adam
        learning_rate: 0.001
        batch_size: 32
        epochs: 10
        loss: mse
        metrics: ["mae"]
        early_stopping_patience: 3

  timeseries:
    - name: nbeats
      params:
        input_chunk_length: 60
        output_chunk_length: 1
        forecast_horizon: 1
        batch_size: 32
        epochs: 10
        random_seed: 42

        hidden_layers: 3
        hidden_units: 128
        num_stacks: 20
        num_blocks: 1
        dropout: 0.10
        optimizer: adam
        learning_rate: 0.001
        activation: relu

        early_stopping_patience: 3
        validation_frequency: 1
        checkpointing: true
        lr_scheduler: reduce_on_plateau
        gradient_clipping: 1.0

    - name: tcn
      params:
        input_chunk_length: 60
        output_chunk_length: 1
        forecast_horizon: 1
        batch_size: 32
        epochs: 10
        random_seed: 42

        hidden_layers: 3
        hidden_units: 64
        kernel_size: 3
        num_filters: 32
        dilation_base: 2
        dropout: 0.20
        optimizer: adam
        learning_rate: 0.001
        activation: relu

        early_stopping_patience: 3
        validation_frequency: 1
        checkpointing: true
        lr_scheduler: reduce_on_plateau
        gradient_clipping: 1.0

    - name: linear_regression
      params:
        input_chunk_length: 60
        output_chunk_length: 1
        forecast_horizon: 1
        random_seed: 42

        lags: 60
        lags_past_covariates: 60
        lags_future_covariates: null
        fit_intercept: true

    - name: lightgbm_classifier
      params:
        input_chunk_length: 60
        output_chunk_length: 1
        forecast_horizon: 1
        random_seed: 42

        lags: 60
        lags_past_covariates: 60
        lags_future_covariates: null
        objective: multiclass
        num_class: 3
        num_leaves: 31
        max_depth: 6
        learning_rate: 0.05
        n_estimators: 300
        feature_fraction: 0.9
        bagging_fraction: 0.8
        bagging_freq: 5
        min_child_samples: 20
        lambda_l1: 0.0
        lambda_l2: 0.0