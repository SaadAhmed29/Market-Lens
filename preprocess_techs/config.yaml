train_start_date: "2025-01-01"
train_end_date: "2025-12-31"
val_start_date: "2026-01-01"
val_end_date: "2026-05-31"

techniques:
  - name: raw_baseline
  - name: log_returns_rolling_zscore
  - name: volatility_scaled
  - name: winsorized_robust
  - name: rolling_rank_transform
  - name: standard_scaler
  - name: minmax_scaler
    feature_min: 0.0
    feature_max: 1.0
  - name: robust_scaler
    quantile_min: 25.0
    quantile_max: 75.0
  - name: maxabs_scaler
  - name: quantile_transformer
    n_quantiles: 1000
    output_distribution: uniform

stationarity_analysis:
  - name: adf
  - name: kpss
  - name: autocorrelation

trend_preservation:
  - name: long_term_trend_retention
  - name: local_trend_retention

models:
  classification:
    - name: lightgbm
    - name: svm
    - name: logistic_regression
  regression:
    - name: lightgbm
    - name: svm
    - name: linear_regression