sample_strategy:
  timehorizon: 5m
  exchange: binance
  symbol: BTC
  long:
    rule: AND
    conditions:
      - left: ind_EMA_20
        operator: cross_above
        right: ind_EMA_50
        persist_bars: 5

      - left: ind_RSI_14
        operator: "<"
        right: 30
        persist_bars: 1

      - left: ind_MACD_12_26_9
        operator: cross_above
        right: ind_MACD_SIGNAL_12_26_9
        persist_bars: 5

  short:
    rule: AND
    conditions:
      - left: ind_EMA_20
        operator: cross_below
        right: ind_EMA_50
        persist_bars: 5

      - left: ind_RSI_14
        operator: ">"
        right: 70
        persist_bars: 1

      - left: ind_MACD_12_26_9
        operator: cross_below
        right: ind_MACD_SIGNAL_12_26_9
        persist_bars: 5


